<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Volta Showdown · NASCON '26</title>
<meta name="description" content="Live draw, fixtures, bracket and results for the NASCON '26 Volta Showdown, a 1v1 Volta football knockout.">
<meta name="theme-color" content="#16191C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316191C'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23F2B705' stroke-width='5'/%3E%3Cpath d='M32 6v52' stroke='%23F2B705' stroke-width='4'/%3E%3C/svg%3E">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: a street cage at night. Asphalt surfaces, chalk lines, floodlight yellow only for what matters right now. */
:root{
  --bg:#E9EBE7; --surface:#FFFFFF; --sunk:#F3F4F1; --ink:#15171A; --muted:#5B6168; --line:#D2D6D0; --line-strong:#A9AFA8;
  --accent:#F2B705; --accent-ink:#7A5800; --on-accent:#15171A;
  --live:#D7263D; --win:#1D7A4C; --hero:#16191C; --hero-ink:#F1F2EE; --hero-muted:#A4AAB0; --chalk:rgba(241,242,238,.13);
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --sunk:#15181A; --ink:#ECEDE9; --muted:#9BA1A7; --line:#2B3034; --line-strong:#454C52;
  --accent:#F5C02E; --accent-ink:#F5C02E; --on-accent:#15171A;
  --live:#FF5363; --win:#4CC38A; --hero:#0A0B0C; --hero-ink:#F1F2EE; --hero-muted:#9BA1A7; --chalk:rgba(241,242,238,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --sunk:#15181A; --ink:#ECEDE9; --muted:#9BA1A7; --line:#2B3034; --line-strong:#454C52;
  --accent:#F5C02E; --accent-ink:#F5C02E; --on-accent:#15171A;
  --live:#FF5363; --win:#4CC38A; --hero:#0A0B0C; --hero-ink:#F1F2EE; --hero-muted:#9BA1A7; --chalk:rgba(241,242,238,.10); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-ink);border-bottom:3px solid var(--accent)}
.top-in{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;text-decoration:none;color:inherit;line-height:1}
.brand-k{font-family:var(--f-data);font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--accent)}
.brand-n{font-family:var(--f-display);font-size:19px;margin-top:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--hero-muted);font-family:var(--f-data);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tab:hover{color:var(--hero-ink);background:rgba(255,255,255,.06)}
.tab[aria-current="page"]{color:var(--on-accent);background:var(--accent)}
.orgbtn{appearance:none;border:1px solid rgba(255,255,255,.22);background:none;color:var(--hero-ink);border-radius:999px;padding:6px 12px;font-family:var(--f-data);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:flex;gap:7px;align-items:center}
.orgbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--hero-muted)}
.orgbtn.on .dot{background:var(--accent)}

main{padding-block:22px 80px;display:flex;flex-direction:column;gap:22px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:28px 26px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 82% 50%,transparent 0 92px,var(--chalk) 92px 94px,transparent 94px),linear-gradient(90deg,transparent calc(82% - 1px),var(--chalk) calc(82% - 1px) calc(82% + 1px),transparent calc(82% + 1px));}
.hero > *{position:relative}
.eyebrow{font-family:var(--f-data);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,64px);line-height:.95;margin-top:8px}
.hero .kick{margin-top:12px;font-size:17px;color:var(--hero-muted)}
.hero .kick b{color:var(--hero-ink)}
.hero-facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.fact{display:flex;flex-direction:column}
.fact b{font-family:var(--f-data);font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.fact span{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--hero-muted);margin-top:4px}
.count{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.count div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 12px;min-width:64px;text-align:center}
.count b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.count span{font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted)}
.prog{margin-top:22px;max-width:520px}
.prog-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog-l{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:13px;color:var(--hero-muted);margin-top:6px;letter-spacing:.03em}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:20px}
.sec-h .sub{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line-strong);border-radius:var(--r);text-align:center;font-size:14px}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;display:flex;justify-content:space-between;gap:12px}
.note time{font-family:var(--f-data);color:var(--muted);font-size:13px;white-space:nowrap}

/* buttons, inputs */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--live);border-color:var(--live)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-family:var(--f-data);font-weight:600;font-size:14px;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--f-data);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{border:1px solid var(--line-strong);background:var(--sunk);border-radius:8px;padding:9px 11px;font-size:15px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.search{position:relative}
.search .inp{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* match rows */
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:200px minmax(0,1fr) 92px minmax(0,1fr) 78px;align-items:center;gap:10px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink);position:relative}
.mrow:first-child{border-top:0}
button.mrow{cursor:pointer}
button.mrow:hover{background:var(--sunk)}
.mrow.s-live{background:color-mix(in srgb,var(--live) 7%,var(--surface))}
.mrow.s-live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--live)}
.m-meta{display:flex;gap:8px;align-items:baseline;font-family:var(--f-data);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-meta b{color:var(--ink);font-weight:700;min-width:30px}
.m-side{font-weight:600;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.m-side small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-side.b{text-align:right}
.m-side.tbd{color:var(--muted);font-weight:500;font-style:italic}
.m-side.win{color:var(--win)}
.m-side.lose{color:var(--muted);font-weight:500}
.m-score{text-align:center;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.m-score.vs{font-family:var(--f-data);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.1em}
.m-score small{display:block;font-family:var(--f-data);font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.m-st{justify-self:end}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--live);color:var(--live)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
.pill.done{border-color:transparent;background:var(--sunk);color:var(--muted)}
.pill.ready{border-color:var(--accent);color:var(--accent-ink)}
.pill.warn{border-color:var(--live);color:var(--live)}
.pill.gold{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:640px){
  .mrow{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);grid-template-areas:"meta meta st" "a sc b";row-gap:8px}
  .m-meta{grid-area:meta}.m-st{grid-area:st}.m-side.a{grid-area:a}.m-score{grid-area:sc}.m-side.b{grid-area:b}
}

/* round header */
.round{display:flex;flex-direction:column;gap:10px}
.round-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.round-h h3{font-family:var(--f-display);font-weight:400;font-size:22px}
.round-h .when{font-family:var(--f-data);color:var(--muted);font-size:15px;letter-spacing:.03em}
.round-h .acts{display:flex;gap:6px;flex-wrap:wrap}

/* timeline of rounds */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stage.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage .t{font-family:var(--f-data);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage .n{font-weight:700;margin-top:2px}
.stage .c{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:70ch}

/* find my match */
.findres{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--sunk);flex-wrap:wrap}
.pcard .nm{font-weight:700;font-size:16px}
.pcard .ins{color:var(--muted);font-size:13px}
.pcard .nx{font-family:var(--f-data);font-size:15px;text-align:right}

/* champion */
.champ{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:22px 24px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.champ h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,42px);line-height:1}
.champ .podium{display:flex;gap:22px;font-family:var(--f-data);font-size:15px;flex-wrap:wrap}
.champ .podium b{display:block;font-size:18px;font-family:var(--f-body)}

/* players */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;color:var(--ink)}
button.prow{cursor:pointer}
button.prow:hover{border-color:var(--line-strong)}
.prow.out{opacity:.62}
.prow .av{width:34px;height:34px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-data);font-weight:700;font-size:14px;flex:none}
.prow .bd{flex:1;min-width:0}
.prow .nm{font-weight:600;line-height:1.2}
.prow .ins{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .st{font-family:var(--f-data);font-size:13px;color:var(--muted);text-align:right;flex:none;max-width:44%}
.prow .st.next{color:var(--accent-ink);font-weight:600}
.prow .tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-family:var(--f-data);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ok{color:var(--win)}
.tag.due{color:var(--live)}

/* bracket */
.bwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bracket{position:relative;display:flex;gap:44px;width:max-content}
.bcol{display:flex;flex-direction:column;gap:0;width:196px;flex:none}
.bcol h4{margin:0 0 10px;font-family:var(--f-data);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);height:18px}
.bgrid{display:grid;grid-template-rows:repeat(20,74px)}
.bcenter{display:flex;flex-direction:column;justify-content:center;gap:28px;height:1480px}
.bk{position:relative;z-index:1;align-self:center;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;font-size:13px}
.bk.s-live{border-color:var(--live)}
.bk.final{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bk-h{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-data);font-size:11.5px;color:var(--muted);padding:2px 7px;background:var(--sunk);letter-spacing:.03em}
.bk-p{display:flex;justify-content:space-between;gap:6px;padding:3px 7px;line-height:1.25}
.bk-p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-p b{font-variant-numeric:tabular-nums}
.bk-p.win{font-weight:700;color:var(--win)}
.bk-p.lose{color:var(--muted)}
.bk-p.tbd span{color:var(--muted);font-style:italic}
.bsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.bsvg path{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.bsvg path.hot{stroke:var(--win);stroke-width:2}
.seeds{background:var(--sunk);border-radius:7px;padding:8px 10px;font-size:13px}
.seeds h5{margin:0 0 6px;font-family:var(--f-data);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seeds ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.seeds li span{color:var(--muted);font-family:var(--f-data)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--f-data);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--f-data);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .rk{font-family:var(--f-data);font-weight:700;color:var(--muted);width:28px}

/* draw */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:40px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pair .k{font-family:var(--f-data);font-weight:700;color:var(--muted)}
.pair .v{font-family:var(--f-data);color:var(--muted);font-size:13px;letter-spacing:.1em}
.pair .b{text-align:right}
.pair .nm{font-weight:600;line-height:1.2}

/* overlays */
#overlay:empty{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,11,12,.6);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h3{font-family:var(--f-data);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.modal .meta{color:var(--muted);font-family:var(--f-data);font-size:14px;margin-top:-8px}
.scoregrid{display:grid;grid-template-columns:minmax(0,1fr) 74px 18px 74px minmax(0,1fr);gap:8px;align-items:center}
.scoregrid .nm{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.scoregrid .nm.b{text-align:right}
.scoregrid .inp{text-align:center;font-family:var(--f-display);font-size:24px;padding:8px 4px}
.scoregrid .dash{text-align:center;color:var(--muted)}
.mrowacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.mrowacts .grp{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--live);font-size:14px;min-height:1em}
.hint{color:var(--muted);font-size:13px}

/* present draw */

    out.forEach(function(o){seedGd[o.id]=o.gd;});
    return out.map(function(o){return o.id;});
  }
  D.forEach(function(d){

    d.a=res(d.sa);d.b=res(d.sb);d.la=lab(d.sa);d.lb=lab(d.sb);
    d.res=null;d.stale=false;d.bye=false;d.win=null;d.lose=null;

    if(d.a==='BYE'||d.b==='BYE'){
      if(d.a&&d.b){d.bye=true;d.win=d.a==='BYE'?d.b:d.a;d.lose='BYE';}
    }else if(r){
      if(d.a&&d.b&&r.pids&&r.pids[0]===d.a&&r.pids[1]===d.b)d.res=r;else d.stale=true;
    }
    if(d.res){
      r=d.res;var aw=r.wo?r.wo==='a':(r.ga!==r.gb?r.ga>r.gb:r.pa>r.pb);
      d.win=aw?d.a:d.b;d.lose=aw?d.b:d.a;
      var A=st[d.a],B=st[d.b],ga=r.wo?(r.wo==='a'?3:0):r.ga,gb=r.wo?(r.wo==='b'?3:0):r.gb;
      if(A&&B){
        A.rgd+=ga-gb;B.rgd+=gb-ga;A.rgf+=ga;B.rgf+=gb;
        if(!r.wo){A.goals+=r.ga;B.goals+=r.gb;A.conc+=r.gb;B.conc+=r.ga;A.played++;B.played++;}

    M[d.id]=d;
  });
  var F=M.M40,TP=M.M39;
  var cur=null;ROUNDS.forEach(function(R){if(!cur&&R.ids.some(function(id){return !M[id].done;}))cur=R;});
  T={D:D,M:M,st:st,seeds:seeds,seedGd:seedGd,cur:cur,end:endAll,t0:t0,stn:stn,slot:slot,placed:placed,
     done:D.filter(function(d){return d.res;}).length,total:D.filter(function(d){return !d.sbye&&!d.bye;}).length,
     byes:D.filter(function(d){return d.sbye;}).length,
     champ:F.res?F.win:null,runner:F.res?F.lose:null,third:TP.res?TP.win:null,fourth:TP.res?TP.lose:null};

}

/* draw builder: works for any number of players from 20 to 80 */
function shuffle(a){var r=new Uint32Array(a.length);crypto.getRandomValues(r);for(var i=a.length-1;i>0;i--){var j=r[i]%(i+1),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function makeDraw(){
  var ids=shuffle(S.players.map(function(p){return p.id;})),N=ids.length,i;
  if(N<20)return 'You need at least 20 players for this bracket. You have '+N+'.';
  if(N>80)return 'This bracket holds up to 80 players. You have '+N+'.';
  var draw=[],playin=[];
  if(N>=40){
    var k=N-40;for(i=0;i<k;i++)playin.push([ids[2*i],ids[2*i+1]]);
    var slots=ids.slice(2*k);for(i=0;i<k;i++)slots.push('P'+(i+1));shuffle(slots);
    for(i=0;i<20;i++)draw.push([slots[2*i],slots[2*i+1]]);
  }else{
    var byes=40-N,ms=shuffle(Array.from({length:20},function(_,j){return j;})),byeSet={};
    for(i=0;i<byes;i++)byeSet[ms[i]]=1;
    var q=ids.slice();
    for(i=0;i<20;i++)draw.push(byeSet[i]?[q.pop(),'']:[q.pop(),q.pop()]);
  }
  S.draw=draw;S.playin=playin;S.drawAt=new Date().toISOString();S.live={};
  return null;
}

  var hits=S.players.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1;}).slice(0,6);
  if(!hits.length)return '<div class="hint">No player matches “'+esc(findQ)+'”.</div>';
  return hits.map(function(p){var s=pstatus(p.id),opp='';
    if(s.m){var o=s.m.a===p.id?s.m.b:s.m.a;opp=isP(o)?'vs '+esc(nm(o)):'vs '+esc(s.m.a===p.id?s.m.lb:s.m.la);}
    return '<div class="pcard"><div><div class="nm">'+esc(p.name)+'</div><div class="ins">'+esc(p.inst)+'</div></div><div class="nx">'+esc(s.t)+(opp?'<div class="hint">'+opp+'</div>':'')+'</div></div>';}).join('');
}

function bkCard(d,extra){
  function row(side){
    var pid=side==='a'?d.a:d.b,c='bk-p';
    if(pid==='BYE')return '<div class="'+c+' tbd"><span>Bye</span><b></b></div>';
    if(!pid)return '<div class="'+c+' tbd"><span>'+esc(side==='a'?d.la:d.lb)+'</span><b></b></div>';
    var sc='';
    if(d.done){c+=d.win===pid?' win':' lose';}
    if(d.res){sc=d.res.wo?(d.win===pid?'W':'–'):(side==='a'?d.res.ga:d.res.gb);
      if(!d.res.wo&&d.res.ga===d.res.gb)sc+=' <small>('+(side==='a'?d.res.pa:d.res.pb)+')</small>';}
    return '<div class="'+c+'"><span>'+esc(nm(pid))+'</span><b>'+sc+'</b></div>';
  }
  return '<div class="bk s-'+d.status+(extra||'')+'" data-m="'+d.id+'"'+(d._style?' style="'+d._style+'"':'')+'><div class="bk-h"><span>'+d.id+(d.sbye?' · bye':' · '+fmt(d.t))+'</span><span>'+(d.status==='live'?'LIVE':d.sbye||T.stn<2?'':'Stn '+d.station)+'</span></div>'+row('a')+row('b')+'</div>';
}
function vBracket(){

  function col(title,ids,span){

  h+=col('Round of 40',RN('R1').ids,1)+col('Round of 20',RN('R2').ids,2)+col('Round of 10',RN('R3').ids,4);

  h+='<div class="bcol"><h4>Eliminator</h4><div class="bcenter">'+seedBox+bkCard(M.M36)+'</div></div>';

  h+='<div class="bcol"><h4>Final</h4><div class="bcenter">'+bkCard(M.M40,' final')+'<div class="hint" style="margin-bottom:-18px">Third place</div>'+bkCard(M.M39)+'</div></div>';
  h+='<svg class="bsvg" id="bsvg" aria-hidden="true"></svg></div></div></section>';

function drawLines(){
  var br=document.getElementById('bracket'),svg=document.getElementById('bsvg');if(!br||!svg)return;
  var o=br.getBoundingClientRect(),W=br.scrollWidth,H=br.scrollHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
  function box(id){var el=br.querySelector('[data-m="'+id+'"]');if(!el)return null;var r=el.getBoundingClientRect();return {l:r.left-o.left,r:r.right-o.left,t:r.top-o.top,b:r.bottom-o.top};}
  var out='';
  T.D.forEach(function(d){
    [['sa',0.33],['sb',0.72]].forEach(function(x){
      var s=d[x[0]],src=s.w||null;
      if(!src&&s.p!=null){var tk=slotTok(s);if(tk&&tk.charAt(0)==='P')src=tk;}
      if(!src)return;var f=box(src),t=box(d.id);if(!f||!t)return;
      var y1=(f.t+f.b)/2,y2=t.t+(t.b-t.t)*(x[1]),x1=f.r,x2=t.l,xm=x2-22;
      if(src.charAt(0)==='P')xm=Math.min(x2-8,x1+10+((parseInt(src.slice(1),10)-1)%8)*4);
      if(xm<x1+8)xm=x1+(x2-x1)/2;
      var hot=T.M[src].done&&((x[0]==='sa'?d.a:d.b)===T.M[src].win);
      out+='<path'+(hot?' class="hot"':'')+' d="M'+x1+' '+y1+'H'+xm+'V'+y2+'H'+x2+'"/>';
    });
  });
  svg.innerHTML=out;
}
function vPlayers(){

    var s=T.st[p.id];
    if(pFilter==='in')return s.alive;
    if(pFilter==='out')return s.placed&&!s.alive;
    if(pFilter==='ci')return !p.ci;
    if(pFilter==='due')return !p.paid;
    if(pFilter==='np')return !s.placed;

  var filters=[['all','All '+S.players.length],['in','Still in'],['out','Knocked out']];
  if(CAN&&ORG){filters.push(['ci','Not checked in'],['due','Fee pending']);if(unplaced().length)filters.push(['np','Not in draw']);}
  var cin=S.players.filter(function(p){return p.ci;}).length;
  var h=drawBanner()+'<section class="sec"><div class="sec-h"><h2>Players</h2><span class="sub">'+(CAN&&ORG?cin+' of '+S.players.length+' checked in':S.players.length+' players from '+new Set(S.players.map(function(p){return p.inst;})).size+' institutes and teams')+'</span></div>'+
   (CAN&&ORG?'<div class="chips"><button class="btn pri" id="addPlayer">Add a player</button><button class="btn" id="importPortal">Import from portal</button>'+(DL?'<button class="btn" data-xlsx="1">Download Excel</button>':'')+'</div>':'')+
   '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="inp" id="pq" placeholder="Search by name or institute" value="'+esc(pQuery)+'" autocomplete="off"></div>'+
   '<div class="chips" role="group" aria-label="Filter">'+filters.map(function(f){return '<button class="chip" data-pf="'+f[0]+'" aria-pressed="'+(pFilter===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>'+
   (CAN&&ORG?'<p class="hint">Tap a player to check them in, mark the fee as paid, rename them, or remove them. Check-ins collect in the bar at the bottom until you save.</p>':'')+'</section>';
  h+=list.length?'<div class="plist">'+list.map(function(p){
    var s=pstatus(p.id),tag=CAN&&ORG?'button':'div';
    var tags=CAN&&ORG?'<div class="tags">'+(p.ci?'<span class="tag ok">Checked in</span>':'<span class="tag">Not checked in</span>')+(p.paid?'':'<span class="tag due">Fee pending</span>')+'</div>':'';
    return '<'+tag+' class="prow'+(s.c==='out'?' out':'')+'"'+(CAN&&ORG?' data-player="'+p.id+'" type="button"':'')+'><span class="av">'+esc(initials(p.name))+'</span><span class="bd"><span class="nm">'+esc(p.name)+'</span><span class="ins" style="display:block">'+esc(p.inst)+'</span>'+tags+'</span><span class="st'+(s.c==='next'?' next':'')+'">'+(s.c==='gold'?'<span class="pill gold">Champion</span>':esc(s.t))+'</span></'+tag+'>';
  }).join('')+'</div>':'<div class="empty">No players match this search.</div>';
  return h;
}
function vStats(){
  var played=T.D.filter(function(d){return d.res&&!d.res.wo;}),goals=0,pens=0,wos=T.D.filter(function(d){return d.res&&d.res.wo;}).length;
  played.forEach(function(d){goals+=d.res.ga+d.res.gb;if(d.res.ga===d.res.gb)pens++;});
  var h='<section class="sec"><div class="sec-h"><h2>Stats</h2>'+(DL?'<button class="btn sm" data-xlsx="1">Download Excel</button>':'<span class="sub">Updated with every result</span>')+'</div><div class="tiles">'+
    '<div class="tile"><b>'+T.done+'<small style="font-size:16px">/'+T.total+'</small></b><span>Matches played</span></div>'+
    '<div class="tile"><b>'+goals+'</b><span>Goals scored</span></div>'+
    '<div class="tile"><b>'+(played.length?(goals/played.length).toFixed(1):'0.0')+'</b><span>Goals per match</span></div>'+
    '<div class="tile"><b>'+pens+'</b><span>Penalty shoot-outs</span></div>'+
    '<div class="tile"><b>'+wos+'</b><span>Walkovers</span></div></div></section>';
  var sc=S.players.filter(function(p){return T.st[p.id].goals>0;}).sort(function(a,b){var x=T.st[a.id],y=T.st[b.id];return y.goals-x.goals||(y.goals-y.conc)-(x.goals-x.conc)||a.name.localeCompare(b.name);}).slice(0,10);
  var big=played.filter(function(d){return d.res.ga!==d.res.gb;}).sort(function(a,b){return Math.abs(b.res.ga-b.res.gb)-Math.abs(a.res.ga-a.res.gb)||(b.res.ga+b.res.gb)-(a.res.ga+a.res.gb);}).slice(0,5);
  h+='<div class="grid2"><section class="sec panel"><div class="sec-h"><h2>Top scorers</h2></div>'+(sc.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Player</th><th class="r">Goals</th><th class="r">Played</th><th class="r">GD</th></tr></thead><tbody>'+
     sc.map(function(p,i){var s=T.st[p.id],gd=s.goals-s.conc;return '<tr><td class="rk">'+(i+1)+'</td><td>'+esc(p.name)+'<div class="hint">'+esc(p.inst)+'</div></td><td class="r"><b>'+s.goals+'</b></td><td class="r">'+s.played+'</td><td class="r">'+(gd>0?'+':'')+gd+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">Top scorers appear after the first results.</div>')+'</section>';
  h+='<section class="sec panel"><div class="sec-h"><h2>Biggest wins</h2></div>'+(big.length?'<div class="tbl-wrap"><table class="tbl"><tbody>'+
     big.map(function(d){var wa=d.win===d.a;return '<tr><td class="rk">'+d.id+'</td><td><b>'+esc(nm(d.win))+'</b> beat '+esc(nm(d.lose))+'</td><td class="r"><b>'+(wa?d.res.ga+'–'+d.res.gb:d.res.gb+'–'+d.res.ga)+'</b></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No results yet.</div>')+'</section></div>';
  var outs=knockedOut();
  h+='<section class="sec panel"><div class="sec-h"><h2>Knocked out</h2><span class="sub">'+outs.length+' of '+S.players.length+' players</span></div>'+
   (outs.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Player</th><th>Team / institute</th><th>Out in</th><th>Lost to</th><th class="r">Score</th></tr></thead><tbody>'+
   outs.map(function(o){return '<tr><td><b>'+esc(o.name)+'</b></td><td>'+esc(o.inst)+'</td><td>'+esc(o.round)+' <span class="hint">'+o.match+'</span></td><td>'+esc(o.by)+'</td><td class="r">'+esc(o.score)+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">Nobody is out yet.</div>')+'</section>';

  var rows=Object.keys(inst).sort(function(a,b){return inst[b].a-inst[a].a||inst[b].n-inst[a].n||a.localeCompare(b);});
  h+='<section class="sec panel"><div class="sec-h"><h2>Institutes &amp; teams</h2><span class="sub">Players entered and still in</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Institute or team</th><th class="r">Entered</th><th class="r">Still in</th></tr></thead><tbody>'+

function tokInfo(t){
  if(t==='')return {name:'Bye',sub:'Opponent goes straight through'};
  if(t&&t.charAt(0)==='P')return {name:'Winner of '+t,sub:'Play-in match'};
  var p=P(t);return p?{name:p.name,sub:p.inst}:{name:'Empty slot',sub:''};
}
function pairHTML(k,pr){var a=tokInfo(pr[0]),b=tokInfo(pr[1]);
  return '<div class="pair"><span class="k">'+k+'</span><span><span class="nm">'+esc(a.name)+'</span><span class="hint" style="display:block">'+esc(a.sub)+'</span></span><span class="v">VS</span><span class="b"><span class="nm">'+esc(b.name)+'</span><span class="hint" style="display:block">'+esc(b.sub)+'</span></span></div>';}
function openSlots(){
  var out=[];
  S.playin.forEach(function(pr,i){var m=T.M['P'+(i+1)];if(m&&m.res)return;pr.forEach(function(t,s){out.push({k:'pi:'+i+':'+s,l:'P'+(i+1)+' · '+tokInfo(t).name});});});
  (S.draw||[]).forEach(function(pr,i){var m=T.M['M'+(i+1)];if(m&&m.res)return;pr.forEach(function(t,s){if(t&&t.charAt(0)==='P')return;out.push({k:'d:'+i+':'+s,l:'M'+(i+1)+' · '+tokInfo(t).name});});});
  return out;
}

/* ---------- render ---------- */
function render(){
  compute();
  var v=view;if(v==='organizer'&&!(CAN&&ORG))v='overview';
  var body=v==='fixtures'?vFixtures():v==='bracket'?vBracket():v==='players'?vPlayers():v==='stats'?vStats():v==='draw'?vDraw():v==='organizer'?vOrganizer():vOverview();
  var bar=DIRTY&&CAN?'<div class="savebar"><span>You have unsaved changes</span><button class="btn pri" id="saveDirty">Save changes</button><button class="btn" id="discard">Discard</button></div>':'';
  document.getElementById('root').innerHTML=header()+'<main class="wrap">'+body+'</main>'+bar;

function readImport(file){
  var err=document.getElementById('ierr');err.textContent='';document.getElementById('impBody').innerHTML='<p class="hint">Reading the file…</p>';
  loadXLSX().then(function(X){return file.arrayBuffer().then(function(buf){return X.read(buf,{type:'array',raw:true});}).then(function(wb){
    var ws=wb.Sheets[wb.SheetNames[0]],rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    var hi=-1,col={};
    for(var i=0;i<Math.min(rows.length,20)&&hi<0;i++){
      rows[i].forEach(function(c,j){var k=String(c).toLowerCase().replace(/[^a-z]/g,'');
        if(k==='participantname'||k==='name')col.name=j;if(k==='institute')col.inst=j;if(k==='paymentstatus')col.pay=j;if(k==='referralcode')col.ref=j;if(k==='cnic')col.cnic=j;if(k==='phonenumber'||k==='phone')col.phone=j;});
      if(col.name!=null)hi=i;else col={};
    }
    if(hi<0)throw new Error('Couldn’t find a ParticipantName or Name column in this file.');
    var people={},order=[];
    rows.slice(hi+1).forEach(function(r){
      var name=String(r[col.name]||'').replace(/\s+/g,' ').trim();if(!name||name==='#')return;
      var cn=col.cnic!=null?String(r[col.cnic]):'',key=cnicKey(cn)||('n:'+normName(name));
      var pay=col.pay!=null?String(r[col.pay]).trim():'',ref=col.ref!=null?String(r[col.ref]).trim():'';
      var paid=/^paid$/i.test(pay),hasRef=!!ref&&!/^(not specified|-|none|n\/a)$/i.test(ref);
      var o=people[key];
      if(!o){o=people[key]={key:key,name:name,inst:String(col.inst!=null?r[col.inst]:'').trim()||'Unknown',paid:false,ref:false};order.push(key);}
      o.paid=o.paid||paid;o.ref=o.ref||hasRef;
    });
    var byKey={},byName={};S.players.forEach(function(p){if(p.key)byKey[p.key]=p;byName[normName(p.name)]=p;});
    var fresh=[],rest=[],gone=[],existing=0,nowPaid=[];
    order.forEach(function(k){var o=people[k],ex=byKey[k]||byName[normName(o.name)];
      if(ex){existing++;if(o.paid&&!ex.paid)nowPaid.push(ex);return;}
      if(S.excluded.indexOf(k)>-1||S.excluded.indexOf('n:'+normName(o.name))>-1){gone.push(o);return;}
      (o.paid||o.ref?fresh:rest).push(o);});
    IMP={fresh:fresh,rest:rest,gone:gone,nowPaid:nowPaid};
    function list(arr,on,pre){return arr.length?'<div class="imp-list">'+arr.map(function(o,i){return '<label class="imp-row"><input type="checkbox" data-imp="'+pre+i+'"'+(on?' checked':'')+'><span class="bd"><b>'+esc(o.name)+'</b><small>'+esc(o.inst)+' · '+(o.paid?'Paid':o.ref?'Unpaid, has referral code':'Unpaid, no referral code')+'</small></span></label>';}).join('')+'</div>':'';}
    document.getElementById('impBody').innerHTML='<p class="hint">'+order.length+' people in the file. '+existing+' already on your list'+(nowPaid.length?', and '+nowPaid.length+' of them have paid since, so they’ll be marked paid':'')+'.</p>'+
      (fresh.length?'<div class="imp-h">New: paid or has a referral code ('+fresh.length+')</div>'+list(fresh,true,'f'):'<p class="hint">No new paid or referral-code entries.</p>')+
      (rest.length?'<div class="imp-h">New: unpaid, no referral code ('+rest.length+')</div><p class="hint">Not ticked. Tick anyone you still want to add.</p>'+list(rest,false,'r'):'')+
      (gone.length?'<div class="imp-h">Removed earlier ('+gone.length+')</div><p class="hint">You took these off the list before, so they aren’t ticked.</p>'+list(gone,false,'g'):'')+
      '<p class="hint">Untick anyone who shouldn’t play, for example entries that don’t fit this male-only event.</p>';
    updImpBtn();
  });}).catch(function(e){document.getElementById('impBody').innerHTML='';err.textContent=(e&&e.message)||'That file couldn’t be read.';});
}

function sideName(d,s){var pid=s==='a'?d.a:d.b;return pid==='BYE'?'Bye':isP(pid)?nm(pid):(s==='a'?d.la:d.lb);}
function waText(rk){
  var R=RN(rk),lines=['*NASCON Volta Showdown*','*'+R.name+'* · '+fmt(R.t0)+' – '+fmt(R.t1),'_Tentative times, one match at a time_',''];
  R.ids.forEach(function(id){var d=T.M[id],a=sideName(d,'a'),b=sideName(d,'b');
    if(d.sbye||d.bye){var w=isP(d.a)?a:isP(d.b)?b:'';if(w)lines.push(d.id+' · '+w+' gets a bye');lines.push('');return;}
    lines.push(d.id+' · '+when(d)+stnTxt(d,1));
    if(d.res){if(d.res.wo)lines.push(nm(d.win)+' wins by walkover vs '+nm(d.lose));
      else lines.push(a+' *'+d.res.ga+'–'+d.res.gb+'* '+b+(d.res.ga===d.res.gb?' ('+d.res.pa+'–'+d.res.pb+' pens)':''));}
    else lines.push(a+' vs '+b);

  lines.push('Be at your station before your match time.');

function lossScore(d,pid){var r=d.res;if(!r)return '';if(r.wo)return 'Walkover';var mine=d.a===pid?r.ga:r.gb,their=d.a===pid?r.gb:r.ga;
  var s=mine+'\u2013'+their;if(r.ga===r.gb){var pm=d.a===pid?r.pa:r.pb,pt=d.a===pid?r.pb:r.pa;s+=' ('+pm+'\u2013'+pt+' pens)';}return s;}

    return {pid:p.id,name:p.name,inst:p.inst,round:RN(d.r).name,ri:order[d.r],match:d.id,num:d.num,by:nm(d.win),score:lossScore(d,p.id),when:when(d),place:pstatus(p.id).t};})

    if(S.players.some(function(p){return normName(p.name)===normName(an);})&&!t.dataset.ok){ae.textContent='There’s already a player called '+an+'. Click Add player again to add them anyway.';t.dataset.ok='1';return;}
    S.players.push({id:nextPid(),name:an,inst:ai||'Independent',paid:document.getElementById('a-paid').checked,ci:document.getElementById('a-ci').checked});
    closeModal();render();publish(an+' added. Redo the draw or place them in the Draw tab.');return;
  }
  if(t.id==='impAdd'&&IMP){
    var added=0;
    document.querySelectorAll('[data-imp]').forEach(function(cb){var v=cb.getAttribute('data-imp');if(v.charAt(0)==='f'&&!cb.checked)exclude(IMP.fresh[+v.slice(1)]);});
    document.querySelectorAll('[data-imp]:checked').forEach(function(cb){var v=cb.getAttribute('data-imp'),o=({f:IMP.fresh,r:IMP.rest,g:IMP.gone})[v.charAt(0)][+v.slice(1)];
      var gi=S.excluded.indexOf(exKey(o));if(gi>-1)S.excluded.splice(gi,1);
      var pl={id:nextPid(),name:o.name,inst:o.inst,paid:o.paid,ci:false};if(o.key.indexOf('n:')!==0)pl.key=o.key;S.players.push(pl);added++;});
    IMP.nowPaid.forEach(function(p){p.paid=true;});
    var np=IMP.nowPaid.length;closeModal();render();
    publish((added?added+(added>1?' players':' player')+' added':'')+(added&&np?', ':'')+(np?np+' marked paid':'')+(added?'. Redo the draw or place them in the Draw tab.':''));return;
  }
  if(t.dataset.place){
    var pid=t.dataset.place,sel=document.getElementById('slot-'+pid).value;if(!sel){toast('Choose who they replace first.');return;}
    var bits=sel.split(':'),arr=bits[0]==='pi'?S.playin:S.draw,old=arr[+bits[1]][+bits[2]];
    arr[+bits[1]][+bits[2]]=pid;render();
    publish(nm(pid)+' placed'+(old&&P(old)?' in place of '+nm(old):''));return;
  }
  if(t.dataset.remove){var rp=t.dataset.remove;twoStep(t,'Click again to remove',function(){var n0=nm(rp);removePlayer(rp);render();publish(n0+' removed');});return;}
  if((t.id==='mSave'||t.dataset.wo||t.id==='mLive'||t.id==='mClear')&&document.getElementById('mts')){var mt=readTimes('mts','mte');if(!mt.ok){document.getElementById('merr').textContent='The end time has to be after the start time.';return;}storeTimes(t.dataset.id,mt);}
  if(t.id==='mSave'){
    var id=t.dataset.id,d=T.M[id],ga=readInt('ga'),gb=readInt('gb'),err=document.getElementById('merr');
    if(ga===null||gb===null||isNaN(ga)||isNaN(gb)){err.textContent='Enter both scores as whole numbers from 0 to 99.';return;}
    var pa=null,pb=null;
    if(ga===gb){pa=readInt('pa');pb=readInt('pb');
      if(pa===null||pb===null||isNaN(pa)||isNaN(pb)){document.getElementById('pensRow').hidden=false;err.textContent='It’s level, so enter the penalty shoot-out score too.';return;}
      if(pa===pb){err.textContent='A shoot-out can’t end level. Check the penalty score.';return;}}
    S.results[id]={ga:ga,gb:gb,pa:pa,pb:pb,wo:null,pids:[d.a,d.b],at:Date.now()};delete S.live[id];
    closeModal();render();publish(id+' saved');return;
  }
  if(t.dataset.wo){var id2=t.dataset.id,d2=T.M[id2];S.results[id2]={ga:null,gb:null,pa:null,pb:null,wo:t.dataset.wo,pids:[d2.a,d2.b],at:Date.now()};delete S.live[id2];closeModal();render();publish('Walkover saved');return;}
  if(t.id==='mClear'){delete S.results[t.dataset.id];closeModal();render();publish('Result cleared');return;}
  if(t.id==='mLive'){var id3=t.dataset.id;if(S.live[id3])delete S.live[id3];else S.live[id3]=true;closeModal();render();publish(S.live[id3]?id3+' is live':id3+' is no longer live');return;}
  if(t.dataset.now){var ni=document.getElementById(t.dataset.now);if(ni){ni.value=nowHM();}return;}
  if(t.id==='saveTimes'){var ids=t.dataset.ids.split(','),bad=null,vals={};
    ids.forEach(function(id){var r=readTimes('ts-'+id,'te-'+id);if(!r.ok&&!bad)bad=id;vals[id]=r;});
    if(bad){document.getElementById('terr').textContent=bad+': the end time has to be after the start time.';return;}
    ids.forEach(function(id){storeTimes(id,vals[id]);});render();publish('Match times saved');return;}
  if(t.id==='pSave'){var p=P(t.dataset.id),n=document.getElementById('e-name').value.trim(),ins=document.getElementById('e-inst').value.trim();
    if(!n){toast('A player needs a name.');return;}
    p.name=n;p.inst=ins||p.inst;p.ci=document.getElementById('e-ci').checked;p.paid=document.getElementById('e-paid').checked;closeModal();markDirty();return;}
  if(t.id==='pRemove'){var rid=t.dataset.id;twoStep(t,'Click again to remove',function(){var n1=nm(rid);removePlayer(rid);closeModal();render();publish(n1+' removed');});return;}
  if(t.id==='saveDirty'){publish('Changes saved');return;}
  if(t.id==='discard'){location.reload();return;}
  if(t.id==='saveSettings'){
    var stn=parseInt(document.getElementById('s-stn').value,10),slot=parseInt(document.getElementById('s-slot').value,10),start=document.getElementById('s-start').value;
    if(!(stn>=1&&stn<=20)){toast('Stations must be between 1 and 20.');return;}
    if(!(slot>=5&&slot<=60)){toast('Match slots must be between 5 and 60 minutes.');return;}
    if(!/^\d{2}:\d{2}$/.test(start)){toast('Enter a kick-off time.');return;}
    S.settings={date:document.getElementById('s-date').value,start:start,stations:stn,slot:slot,venue:document.getElementById('s-venue').value.trim()};
    render();publish('Settings saved');return;
  }
  if(t.id==='postNote'){var tx=document.getElementById('n-text').value.trim();if(!tx){toast('Write the announcement first.');return;}S.notes=[{text:tx,at:Date.now()}].concat(S.notes);render();publish('Announcement posted');return;}
  if(t.dataset.delnote!=null){S.notes.splice(+t.dataset.delnote,1);render();publish('Announcement deleted');return;}
  if(t.id==='redraw'){if(anyResults())return;twoStep(t,'Click again to redo the draw',function(){var e2=makeDraw();if(e2){toast(e2);return;}render();publish('New draw saved');});return;}
  if(t.id==='clearAll'){twoStep(t,'Click again to clear every result',function(){S.results={};S.live={};render();publish('All results cleared');});return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='impFile'&&t.files&&t.files[0])readImport(t.files[0]);
  if(t.hasAttribute&&t.hasAttribute('data-imp'))updImpBtn();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='findq'){findQ=t.value;document.getElementById('findres').innerHTML=findRes();}
  if(t.id==='pq'){pQuery=t.value;var pos=t.selectionStart;render();var n=document.getElementById('pq');n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}
  if(t.id==='ga'||t.id==='gb'){var a=document.getElementById('ga').value,b=document.getElementById('gb').value;document.getElementById('pensRow').hidden=!(a!==''&&a===b);}
});
document.addEventListener('keydown',function(e){
  if(document.getElementById('show')){
    if(e.key==='Escape'){closeModal();}
    else if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();showStep(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();showStep(-1);}
    return;
  }
  if(e.key==='Enter'&&e.target&&e.target.id==='pw'){var g=document.getElementById('pwGo');if(g)g.click();return;}
  if(e.key==='Escape'&&document.getElementById('scrim'))closeModal();
});
window.addEventListener('hashchange',function(){setView();render();window.scrollTo(0,0);});
window.addEventListener('resize',function(){if(view==='bracket')drawLines();});
setInterval(function(){var cd=document.getElementById('cd');if(cd)cd.outerHTML=countdownHTML()||'<span id="cd"></span>';},1000);

/* ---------- boot ---------- */
setView();render();
if(MODE==='web'){
  DL=WEB_DL;render();
  webLoad();setInterval(webLoad,10000);
  var saved=ls('volta-key');if(saved)tryLogin(saved,true);
}
if(MODE==='artifact'){
  window.claude.use('artifact').then(function(a){ART=a;});
  window.claude.use('downloads').then(function(d){DL=d;if(d)render();});
  window.claude.use('user').then(function(u){
    if(!u)return;
    u.canEdit().then(function(ok){CAN=!!ok;ORG=CAN&&ls('volta-org')!=='0';if(CAN)render();});
  });
}
})();
</script>
</body>
</html>
